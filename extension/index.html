<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <div class="logo-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
        </div>
        <h1>FanSync AI</h1>
      </div>
      <div class="status-indicator" id="status-indicator">
        <span class="dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </header>

    <main>
      <div class="input-group">
        <label for="apiKey">Gemini API Key</label>
        <div class="password-wrapper">
          <input type="password" id="apiKey" placeholder="Enter your Google AI API Key">
          <button type="button" id="togglePassword" class="icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <p class="help-text">Get one for free at <a href="https://aistudio.google.com/app/apikey" target="_blank">AI Studio</a></p>
      </div>

      <div class="input-group">
        <label for="defaultPersona">Default Persona</label>
        <select id="defaultPersona">
          <option value="tsundere">Tsundere (Spicy/Sales)</option>
          <option value="gyaru">Gyaru (Playful/Casual)</option>
          <option value="mature">Mature (Elegant/Expensive)</option>
          <option value="learned">Learned Style (Custom)</option>
        </select>
      </div>

      <div class="stats-mini">
        <div class="stat">
          <span class="val" id="credit-count">0</span>
          <span class="lbl">Credits</span>
        </div>
        <div class="stat">
          <span class="val" id="tier-label">None</span>
          <span class="lbl">Tier Status</span>
        </div>
      </div>

      <div class="button-row">
        <button id="testBtn" class="secondary-btn">Test Connection</button>
        <button id="saveBtn" class="primary-btn">Save Settings</button>
      </div>
    </main>

    <footer>
      <p>Version 1.0.0 &copy; 2026 FanSync AI</p>
      <a href="https://fan-sync-ai.vercel.app" target="_blank">Open Dashboard</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
